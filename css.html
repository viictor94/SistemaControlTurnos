<style>

/********************************************************
 GENERAL
********************************************************/

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    font-family:Segoe UI,Arial,sans-serif;
    background:linear-gradient(180deg,#f8fbf8,#eef5ef);
    user-select:none;
    overflow:hidden;
}

/********************************************************
 BARRA SUPERIOR
********************************************************/

.topbar{

    width:100%;
    height:60px;

    background:#3e863c;

    display:flex;

    justify-content:center;

    align-items:center;

    box-shadow:0 3px 10px rgba(0,0,0,.18);

}

.tituloSistema{

    color:white;

    font-size:24px;

    font-weight:600;

    letter-spacing:1px;

}

/********************************************************
 CONTENEDOR
********************************************************/

.contenedor{

    height:calc(100vh - 110px);

    display:flex;

    justify-content:center;

    align-items:center;

}

/********************************************************
 TARJETA
********************************************************/

.card{

    width:470px;

    background:white;

    border-radius:28px;

    padding:25px 35px;

    text-align:center;

    box-shadow:
        0 12px 35px rgba(0,0,0,.12);

    animation:aparecer .65s ease;

}

/********************************************************
 LOGO
********************************************************/

.logo{

    width:165px;

    margin:8px auto 22px;

    display:block;

    filter:drop-shadow(0 6px 12px rgba(0,0,0,.12));

}

/********************************************************
 HORA
********************************************************/

#hora{

    font-size:60px;

    font-weight:bold;

    color:#3e863c;

}

/********************************************************
 FECHA
********************************************************/

#fecha{

    margin-top:8px;

    margin-bottom:35px;

    font-size:21px;

    color:#2f2f2f;

    text-transform:capitalize;

}

/********************************************************
 TEXTO
********************************************************/

.textoIngreso{

    font-size:24px;

    color:#444;

    margin-bottom:18px;

}

/********************************************************
 INPUT
********************************************************/

input{
    width:100%;
    height:62px;
    border:2px solid #D8D8D8;
    border-radius:18px;
    font-size:30px;
    text-align:center;
    transition:.25s;
    outline:none;
}

input:focus{
    border-color:#3e863c;
    box-shadow:0 0 12px rgba(62,134,60,.25);
}

input::placeholder{
    color:#999;
}

/********************************************************
 BOTÓN MARCAR
********************************************************/

#btnMarcar{

    width:100%;
    height:62px;
    margin-top:22px;
    border:none;
    border-radius:18px;
    color:white;
    font-size:23px;
    font-weight:bold;
    cursor:pointer;
    transition:.18s;
    background:linear-gradient(180deg,#4d974a,#3e863c);
    transform:translateY(-2px);
}

#btnMarcar:hover{

    filter:brightness(108%);

}

#btnMarcar:active{

    transform:scale(.97);

}

/********************************************************
 BOTÓN ALMUERZO
********************************************************/

#btnAlmuerzo{

    width:46%;
    height:45px;
    margin-top:18px;
    border:1px solid #3e863c;
    border-radius:14px;
    background:#EDF7ED;
    color:#3e863c;
    font-size:17px;
    cursor:pointer;
    transition:.18s;
    
}

#btnAlmuerzo:hover{

    background:#D7D7D7;

}

#btnAlmuerzo:active{

    transform:scale(.96);

}

/******************************************************
 NOTIFICACIONES
******************************************************/

#notificacion{

    width:100%;

    min-height:55px;

    margin-top:20px;

    border-radius:14px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:10px;

    padding:14px;

    font-size:16px;

    font-weight:600;

    opacity:0;

    visibility:hidden;

    transform:translateY(20px);

    transition:
        opacity .35s ease,
        transform .35s ease;

}

#notificacion.mostrar{

    opacity:1;

    visibility:visible;

    transform:translateY(0);

}

#iconoMensaje{

    font-size:22px;

}

/************** COLORES **************/

.exito{

    background:#e8f7e8;

    color:#2e7d32;

    border:1px solid #9dd39d;

}

.error{

    background:#fdeaea;

    color:#c62828;

    border:1px solid #f2a5a5;

}

.alerta{

    background:#fff7e5;

    color:#c97b00;

    border:1px solid #ffd56d;

}

.info{

    background:#e8f3ff;

    color:#1565c0;

    border:1px solid #9fc6ff;

}

/********************************************************
 FOOTER
********************************************************/

footer{

    height:40px;

    display:flex;

    justify-content:center;

    align-items:center;

}

#control{

    color:#3e863c;

    cursor:pointer;

    text-decoration:underline;

    font-size:16px;

}

#control:hover{

    color:#3e863c;

}

/********************************************************
 ANIMACIONES
********************************************************/

@keyframes aparecer{

    from{

        opacity:0;

        transform:translateY(25px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

/********************************************************
 RESPONSIVE
********************************************************/

@media (max-width:600px){

    .card{

        width:94%;

        padding:25px;

    }

    #hora{

        font-size:48px;

    }

    .tituloSistema{

        font-size:18px;

    }

}


/* ===========================
   OVERLAY DE CARGA
=========================== */

#overlayCarga{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.60);

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    z-index:99999;

    backdrop-filter:blur(3px);

}

#overlayCarga.mostrar{

    display:flex;

}

.iconoCarga{

    font-size:95px;

    color:#ffffff;

    animation:pulso 1s ease-in-out infinite;

}

.textoCarga{

    margin-top:22px;

    color:#ffffff;

    font-size:28px;

    font-weight:600;

    letter-spacing:.5px;

}

@keyframes pulso{

    0%{

        transform:scale(1);

        opacity:.75;

    }

    50%{

        transform:scale(1.15);

        opacity:1;

    }

    100%{

        transform:scale(1);

        opacity:.75;

    }

}

/*=========================================
  MODAL JUSTIFICACIÓN
=========================================*/

.modal{

    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:9999;

    justify-content:center;
    align-items:center;

}

.modal.mostrar{

    display:flex;

}

.modal-contenido{

    width:480px;
    max-width:90%;

    background:#fff;

    border-radius:12px;

    padding:25px;

    box-shadow:0 8px 30px rgba(0,0,0,.25);

}

.modal-contenido h2{

    margin-top:0;
    margin-bottom:10px;

}

.modal-contenido textarea{

    width:100%;
    height:120px;

    resize:none;

    margin-top:10px;

    padding:10px;

    font-size:15px;

    border-radius:8px;

    border:1px solid #CCC;

    box-sizing:border-box;

}

.modal-botones{

    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:20px;

}

.btn-secundario{

    background:#9E9E9E;

}
</style>
