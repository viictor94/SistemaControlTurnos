<script>

function actualizarHora(){

    const ahora = new Date();

    document.getElementById("hora").innerHTML =
        ahora.toLocaleTimeString("es-AR",{
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:false
        });

    document.getElementById("fecha").innerHTML =
        ahora.toLocaleDateString("es-AR",{
            weekday:"long",
            year:"numeric",
            month:"long",
            day:"numeric"
        });

}

/*=========================================
  OVERLAY DE CARGA
=========================================*/

function mostrarCarga(){

    document
        .getElementById("overlayCarga")
        .classList.add("mostrar");

    document.getElementById("btnMarcar").disabled = true;
    document.getElementById("btnAlmuerzo").disabled = true;
    document.getElementById("dni").disabled = true;

}

function ocultarCarga(){

    document
        .getElementById("overlayCarga")
        .classList.remove("mostrar");

    document.getElementById("btnMarcar").disabled = false;
    document.getElementById("btnAlmuerzo").disabled = false;
    document.getElementById("dni").disabled = false;

}

/*=========================================
  INICIALIZACIÓN
=========================================*/

actualizarHora();

setInterval(actualizarHora,1000);

const dni = document.getElementById("dni");
let dniPendiente = "";
window.onload = function(){
    dni.focus();
    mostrarMensaje(
        "ok",
        "Sistema listo para registrar marcaciones."
    );
};

/*=========================================
  EVENTOS
=========================================*/

dni.addEventListener("keypress",function(e){

    if(dni.disabled){
        return;
    }

    if(e.key==="Enter"){
        validarEmpleado();
    }

});

document.addEventListener("keydown",function(e){

    if(e.key==="F2"){

        e.preventDefault();

        if(!dni.disabled){
            registrarAlmuerzo();
        }

    }

});

document
    .getElementById("btnMarcar")
    .addEventListener("click",validarEmpleado);

document
    .getElementById("btnAlmuerzo")
    .addEventListener("click",registrarAlmuerzo);

    /*=========================================
  MENSAJES
=========================================*/

function mostrarMensaje(tipo,texto){

    const caja = document.getElementById("notificacion");
    const icono = document.getElementById("iconoMensaje");
    const mensaje = document.getElementById("textoMensaje");

    caja.className = "";

    switch(tipo){

        case "ok":

            caja.classList.add("exito");
            icono.innerHTML = "✔";
            break;

        case "error":

            caja.classList.add("error");
            icono.innerHTML = "✖";
            break;

        case "alerta":

            caja.classList.add("alerta");
            icono.innerHTML = "⚠";
            break;

        default:

            caja.classList.add("info");
            icono.innerHTML = "ℹ";

    }

    mensaje.innerHTML = texto;

    caja.classList.add("mostrar");

    setTimeout(function(){

        caja.classList.remove("mostrar");

    },3000);

}

/*=========================================
  VALIDAR EMPLEADO
=========================================*/

function validarEmpleado(){

    const dniIngresado = dni.value.trim();

    if(dniIngresado==""){

        mostrarMensaje(
            "alerta",
            "Ingrese un DNI."
        );

        return;

    }

    mostrarCarga();

    google.script.run
        .withSuccessHandler(respuestaMarcacion)
        .withFailureHandler(function(error){

            ocultarCarga();

            mostrarMensaje(
                "error",
                "Error de comunicación con el servidor."
            );

            console.error(error);

        })
        .registrarMarcacion(dniIngresado);

}

/*=========================================
  ALMUERZO
=========================================*/

function registrarAlmuerzo(){

    const dniIngresado = dni.value.trim();

    if(dniIngresado==""){

        mostrarMensaje(
            "alerta",
            "Ingrese un DNI."
        );

        return;

    }

    mostrarCarga();

    google.script.run
        .withSuccessHandler(respuestaMarcacion)
        .withFailureHandler(function(error){

            ocultarCarga();

            mostrarMensaje(
                "error",
                "Error de comunicación con el servidor."
            );

            console.error(error);

        })
        .registrarAlmuerzo(dniIngresado);

}

function abrirModalJustificacion(dni){

    dniPendiente = dni;

    document.getElementById("txtJustificacion").value = "";

    document
        .getElementById("modalJustificacion")
        .classList.add("mostrar");

    document
        .getElementById("txtJustificacion")
        .focus();

}


function cerrarModalJustificacion(){

    document
        .getElementById("modalJustificacion")
        .classList.remove("mostrar");

}

function cancelarJustificacion(){

    cerrarModalJustificacion();

    document.getElementById("dni").select();
    document.getElementById("dni").focus();

}

function guardarJustificacion(){

    const motivo =
        document
            .getElementById("txtJustificacion")
            .value
            .trim();

    if(motivo==""){

        mostrarMensaje(
            "alerta",
            "Debe ingresar una justificación."
        );

        return;

    }

    cerrarModalJustificacion();

    mostrarCarga();

    google.script.run
        .withSuccessHandler(respuestaMarcacion)
        .withFailureHandler(function(error){

            ocultarCarga();

            mostrarMensaje(
                "error",
                "No se pudo registrar la marcación."
            );

            console.error(error);

        })
        .registrarMarcacion(
            dniPendiente,
            motivo
        );

}

/*=========================================
  RESPUESTA DEL SERVIDOR
=========================================*/

function respuestaMarcacion(respuesta){
    ocultarCarga();
if (respuesta.requiereJustificacion) {

    abrirModalJustificacion(
        document.getElementById("dni").value.trim()
    );

    return;

}

    if(!respuesta.ok){

        document.getElementById("dni").select();

        mostrarMensaje(
            "error",
            respuesta.mensaje
        );

        return;

    }

    let texto = "";

    switch(respuesta.evento){

        case "E1":
            texto = "¡Bienvenido, " + respuesta.empleado + "! Buena jornada.";
            break;

        case "S1":
            texto = "Salida registrada.";
            break;

        case "E2":
            texto = "Ingreso registrado.";
            break;

        case "SF":
            texto = "Hasta mañana " + respuesta.empleado + ".";
            break;

        case "A1":
            texto = "Buen almuerzo, " + respuesta.empleado + ".";
            break;

        case "A2":
            texto = "Fin de almuerzo registrado.";
            break;

        default:
            texto = "Marcación registrada correctamente.";

    }

    mostrarMensaje("ok", texto);

    document.getElementById("dni").value = "";
    document.getElementById("dni").focus();

}

</script>
